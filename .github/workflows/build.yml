name: Build Flutter Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Write .env
        run: echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Install Apple certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PWD=$(openssl rand -hex 12)

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Build macOS release
        run: flutter build macos --release

      - name: Code sign with Developer ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="build/macos/Build/Products/Release/flutter_pos.app"
          IDENTITY="Developer ID Application: Dwight Danda ($APPLE_TEAM_ID)"

          # Sign all frameworks and helpers first, then the app
          find "$APP_PATH" -name "*.framework" -o -name "*.dylib" | while read f; do
            codesign --deep --force --options runtime --sign "$IDENTITY" "$f"
          done
          codesign --deep --force --options runtime --sign "$IDENTITY" "$APP_PATH"

          # Verify
          codesign --verify --verbose "$APP_PATH"

      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          /usr/bin/ditto -c -k --keepParent flutter_pos.app flutter_pos_macos.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter_pos_macos
          path: build/macos/Build/Products/Release/flutter_pos_macos.zip
          retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Write .env
        run: echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip release folder
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath flutter_pos_windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter_pos_windows
          path: flutter_pos_windows.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete existing 'latest' release
        if: steps.version.outputs.tag == 'latest'
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag == 'latest' && 'Latest Build' || steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.tag == 'latest' }}
          files: |
            flutter_pos_macos/flutter_pos_macos.zip
            flutter_pos_windows/flutter_pos_windows.zip
          generate_release_notes: true
